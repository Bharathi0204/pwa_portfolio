<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="#0B0F19" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#bgGrad)" stroke-width="8" stroke-opacity="0.8" fill="#0E1322" />
  
  <!-- Cybernetic Grid / Circuit nodes -->
  <path d="M 96 160 L 200 160 L 256 216 L 312 216 L 416 160" stroke="#0284C7" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />
  <path d="M 96 352 L 200 352 L 256 296 L 312 296 L 416 352" stroke="#10B981" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="256" cy="256" r="140" stroke="url(#bgGrad)" stroke-width="4" opacity="0.3" />

  <!-- Monogram BE & Terminal Symbol -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)">BE</text>
  
  <circle cx="160" cy="140" r="10" fill="#38BDF8" />
  <circle cx="352" cy="140" r="10" fill="#10B981" />
  <circle cx="256" cy="390" r="12" fill="#6366F1" />
</svg>
